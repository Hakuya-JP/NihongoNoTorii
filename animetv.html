<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hablemos en Japonés - ToriiTV</title>
  
  <!-- Fuentes de Google Fonts para tipografías japonesas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="main-header">
  <div class="header-brand">
    <a href="index.html" class="nav-logo">
      <img src="image/logonnt.png" alt="Logo Nihongo no Torii">
    </a>
    <h1 class="logo-text">Nihongo no Torii</h1>
  </div>

  <button class="hamburger" onclick="toggleMenu()" aria-label="Abrir menú">☰</button>

  <nav id="menu" class="top-nav">
    <a href="index.html">Inicio</a>
    <a href="lecciones.html">Lecciones</a>
    <a href="videos.html">Videos</a>
    <a href="kana.html">Kana</a>
    <a href="biblioteca.html">Biblioteca</a>
    <a href="manga.html">Manga/Novela</a>
    <a href="animetv.html">AnimeTV</a>
    <button id="dark-mode-toggle" class="theme-toggle-btn" onclick="toggleDarkMode()">🌙</button>
  </nav>
</header>

<section class="seccion-reproductor">
  <h2 class="seccion-titulo">ToriiTV</h2>

  <!-- CONTENEDOR PRINCIPAL (Grid de 2 columnas) -->
  <div class="player-container">
    
    <!-- 1. ZONA DEL VIDEO (Columna 1, Fila 1) -->
    <div id="video-wrapper" class="video-container">
      <video id="main-video" controls>
        Tu navegador no soporta la reproducción de video HTML5.
      </video>

      <!-- Botón flotante para pantalla completa -->
      <button id="btn-fullscreen" class="btn-player-fs" title="Pantalla completa">
        ⛶
      </button>

      <!-- Botón flotante para panel de ajustes -->
      <button id="btn-toggle-config" class="btn-toggle-config" title="Ajustes de subtítulos">
        ⚙️
      </button>

      <!-- Subtítulo flotante sobre el video -->
      <div id="overlay-subtitles" class="overlay-subtitles sin-fondo">
        Carga un video y un archivo de subtítulos para comenzar
      </div>

      <!-- Panel flotante de configuración -->
      <div class="video-overlay-config oculto" id="video-config-panel">
        
        <!-- Sincronización -->
        <div class="toolbar-group">
          <span class="tool-label">Sincro:</span>
          <button id="btn-sub-minus" class="btn-tool-sm">-0.5s</button>
          <button id="btn-sub-plus" class="btn-tool-sm">+0.5s</button>
        </div>

        <!-- Tamaño de texto y Furigana -->
        <div class="toolbar-group">
          <span class="tool-label">Zoom:</span>
          <button id="btn-text-minus" class="btn-tool-sm">A-</button>
          <button id="btn-text-plus" class="btn-tool-sm">A+</button>
          <button id="btn-toggle-furigana" class="btn-tool-sm active-tool">Furigana</button>
        </div>

        <!-- Fuente y Color del Texto -->
        <div class="toolbar-group">
          <span class="tool-label">Texto:</span>
          <input type="color" id="sub-color-picker" value="#ffffff" title="Color de texto" />
          
          <span class="tool-label">Fuente:</span>
          <select id="sub-font-family">
            <option value="system-ui, sans-serif">Predeterminada</option>
            <option value="'M PLUS Rounded 1c', sans-serif">Redonda (Anime)</option>
            <option value="'Shippori Mincho', 'Yu Mincho', serif">Formal (Mincho)</option>
          </select>
        </div>

        <!-- Fondo del Subtítulo -->
        <div class="toolbar-group">
          <span class="tool-label">Fondo:</span>
          <input type="color" id="sub-bg-color-picker" value="#000000" title="Color de fondo" />
          <button id="btn-toggle-bg" class="btn-tool-sm" title="Activar/Desactivar fondo">Fondo</button>
        </div>

      </div>
    </div>

    <!-- 2. BARRA DE HERRAMIENTAS INFERIOR (Columna 1, Fila 2) -->
    <div class="player-toolbar">
      <div class="toolbar-group">
        <label class="btn-tool" for="input-video">
          <h3>📂 Cargar Video </h3>
          <input type="file" id="input-video" accept="video/*" hidden />
        </label>
        <label class="btn-tool" for="input-sub">
          <h3>💬 Cargar Subtítulo</h3>
          <input type="file" id="input-sub" accept=".srt,.vtt,.ass,.ssa" hidden />
        </label>
        <button id="btn-export-sub" class="btn-tool btn-secundario-tool">
          <h3>💾 Descargar</h3>
        </button>
      </div>
    </div>

    <!-- 3. PANEL LATERAL DE SUBTÍTULOS (Columna 2, Filas 1 y 2) -->
    <div class="subtitles-sidebar">
      <div class="sidebar-header">
        <h3>Transcripción</h3>
        <span id="sub-count" class="sub-badge">0 líneas</span>
      </div>
      <div id="subtitles-list" class="subtitles-list">
        <p class="sub-placeholder">Los subtítulos cargados aparecerán aquí en formato de lista para navegar entre ellos.</p>
      </div>
    </div>

  </div>
</section>

<script src="scripts.js"></script>
</body>
</html>
